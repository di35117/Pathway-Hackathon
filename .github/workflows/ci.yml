name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Engine + dashboard deps only. Pathway is exercised separately in the
          # pathway-smoke job because it is a heavy install.
          pip install flask paho-mqtt python-dotenv requests litellm pyjwt bcrypt
          pip install pytest pytest-cov ruff

      - name: Lint
        run: ruff check . --output-format=github

      - name: Run tests with coverage
        run: |
          pytest -q \
            --cov=core --cov=decision_engine --cov=decision_engine_v2 \
            --cov=risk_engine_v2 --cov=simulation_v2 --cov=pipeline --cov=dashboard \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pathway-smoke:
    name: Pathway import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pathway
        run: |
          python -m pip install --upgrade pip
          pip install pathway paho-mqtt python-dotenv litellm

      - name: Verify Pathway dataflows build
        run: |
          # Import-only: confirms schemas, UDFs and connector subjects are valid
          # without needing a live MQTT broker.
          python -c "
          import pipeline.pathway_mqtt_bridge as b
          import pipeline.pathway_rag_pipeline_v2 as r
          assert b.TempEventSchema and b.GpsEventSchema
          assert b.ReeferEventSchema and b.DoorEventSchema
          assert r.QuerySchema
          print('Pathway dataflows import cleanly; 4 stream schemas present')
          "

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: livecold:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image can run the CLI
        run: |
          docker run --rm --entrypoint python livecold:ci main.py | head -20
          docker run --rm --entrypoint python livecold:ci -c "
          from core.sop_parser import get_product_temp_ranges, get_source
          r = get_product_temp_ranges()
          assert get_source() == 'sop', 'SOP must ship inside the image'
          assert len(r) == 9, f'expected 9 products, got {len(r)}'
          print('image OK:', len(r), 'products from SOP')
          "
